<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>OEE Performance Dashboard</title>
  <link rel="stylesheet" href="style.css"/>
  <!-- PapaParse for CSV -->
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <!-- Chart.js for visualization -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
  <header>
    <h1>📊 OEE Performance Dashboard</h1>
    <p class="subtitle">Live data from Google Sheets</p>
  </header>

 <section class="filters">
  <div class="filter-group">
    <label for="sbuFilter">SBU</label>
    <select id="sbuFilter"><option value="">Loading…</option></select>
  </div>
  <div class="filter-group">
    <label for="sectionFilter">Section</label>
    <select id="sectionFilter"><option value="">All</option></select>
  </div>
  <div class="filter-group">
    <label for="yearFilter">Year</label>
    <select id="yearFilter"><option value="">All Years</option></select>
  </div>
  <div class="filter-group">
    <label for="monthFilter">Month</label>
    <select id="monthFilter"><option value="">All Months</option></select>
  </div>
  <button id="resetBtn">🔄 Reset</button>
</section>


 <!-- 🆕 Top row: 4 new KPI cards -->
<section class="kpis kpis-top">
  <div class="kpi-card"><h3>Avg NPT %</h3><p id="kpiNPT">—</p></div>
  <div class="kpi-card"><h3>Avg MTTR</h3><p id="kpiMTTR">—</p></div>
  <div class="kpi-card"><h3>Avg MTBF</h3><p id="kpiMTBF">—</p></div>
  <div class="kpi-card"><h3>Avg Cap UT %</h3><p id="kpiCapUT">—</p></div>
</section>

<!-- Existing KPI row -->
<section class="kpis">
  <div class="kpi-card"><h3>Avg OEE</h3><p id="kpiOEE">—</p></div>
  <div class="kpi-card"><h3>Avg Availability</h3><p id="kpiAV">—</p></div>
  <div class="kpi-card"><h3>Avg Performance</h3><p id="kpiPerf">—</p></div>
  <div class="kpi-card"><h3>Avg Quality</h3><p id="kpiQuality">—</p></div>
  <div class="kpi-card"><h3>Total Output</h3><p id="kpiOutput">—</p></div>
  <div class="kpi-card"><h3>Records</h3><p id="kpiCount">—</p></div>
</section>


  <section class="charts">
    <div class="chart-box"><canvas id="oeeTrend"></canvas></div>
    <div class="chart-box"><canvas id="avPerfQual"></canvas></div>
    <div class="chart-box"><canvas id="targetVsActual"></canvas></div>
    <div class="chart-box"><canvas id="mtbfMttr"></canvas></div>
  </section>

  <section class="table-wrap">
    <h2>Filtered Data</h2>
    <div class="table-scroll">
      <table id="dataTable"></table>
    </div>
  </section>

  <footer><p>AUTOMATED MANUFACTURING SUMMARY REPORT BY OPEX TEAM.</p></footer>

  <script src="app.js"></script>
</body>
</html>
